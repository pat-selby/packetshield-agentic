# PacketShield-Agentic backing services: pgvector CVE store + Redis pub/sub.
#   docker compose up -d
#   DATABASE_URL=postgresql://packetshield:packetshield@localhost:5432/packetshield \
#       python agent/load_cves.py
#   uvicorn agent.orchestrator:app --host 0.0.0.0 --port 8000
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: packetshield-postgres
    environment:
      POSTGRES_USER: packetshield
      POSTGRES_PASSWORD: packetshield
      POSTGRES_DB: packetshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./agent/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: packetshield-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
